<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>{% block title %}Pastelería Artesanal{% endblock %}</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body class="bg-light d-flex flex-column min-vh-100">

        <header>
            <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
                <div class="container">
                    <a class="navbar-brand fw-bold" href="{% url 'catalogo' %}">🍰 Pastelería Artesanal</a>
                    <div class="ms-auto">
                        <a class="btn btn-outline-light btn-sm" href="{% url 'catalogo' %}">Catálogo</a>
                        <a class="btn btn-warning btn-sm ms-2" href="/admin/">Administración</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container mb-5">
            {% block content %}{% endblock %}
        </main>

        <footer class="bg-dark text-white text-center py-3 mt-auto">
            <small>Pastelería Artesanal, Encargos con retiro en tienda</small>
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
